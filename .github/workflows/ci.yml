name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  iac-scan:
    name: IaC misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy config scan (Terraform, Kubernetes, Helm)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  manifests:
    name: Render + validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and render the chart
        run: |
          helm lint charts/demo-app
          helm template demo charts/demo-app > /tmp/demo.yaml
      - name: Validate rendered and raw manifests
        run: |
          kubeconform -strict -summary /tmp/demo.yaml
          # Policies and ArgoCD Applications are CRDs; validate them against the community CRD catalog.
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            policies/ gitops/ bootstrap/root-app.yaml

  e2e:
    name: End-to-end — policies enforced on a real cluster
    runs-on: ubuntu-latest
    needs: [manifests]
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: secure-gitops
          config: kind/cluster.yaml

      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno --version 3.3.4 -n kyverno --create-namespace --wait --timeout 5m

      - name: Apply admission policies from this repo
        run: |
          kubectl apply -f policies/
          kubectl wait --for=condition=Ready clusterpolicy --all --timeout=120s

      - name: Deploy the hardened demo app (must pass every policy)
        run: |
          helm install demo charts/demo-app -n demo --create-namespace --wait --timeout 3m
          kubectl -n demo get pods

      - name: Insecure workloads must be rejected
        run: |
          set +e
          fail=0
          kubectl run bad-privileged -n demo --image=nginx:1.27 --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"c","image":"nginx:1.27","securityContext":{"privileged":true}}]}}' \
            && { echo "::error::privileged pod was admitted"; fail=1; } || echo "✓ privileged pod rejected"
          kubectl run bad-latest -n demo --image=nginx:latest --restart=Never \
            && { echo "::error::':latest' image was admitted"; fail=1; } || echo "✓ :latest image rejected"
          exit $fail

      - name: Install ArgoCD (smoke test)
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm install argocd argo/argo-cd --version 7.7.5 -n argocd --create-namespace -f bootstrap/argocd-values.yaml --wait --timeout 5m
          kubectl -n argocd get pods

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
