replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.1" # pin by tag (or digest in production)
  pullPolicy: IfNotPresent

service:
  port: 9898

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Namespaces allowed to reach the app (default-deny otherwise).
ingressFromNamespaces:
  - ingress-nginx
